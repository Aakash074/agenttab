# Render blueprint (free plan): chipnet API + the web app as a static site.
# No private keys are typed anywhere: KEY_SEED is generated by Render and the server derives its role keys from it
# (packages/server/src/env.ts withSeedKeys). Mainnet API: 1¢ direct pay, plus the demo agent in visitor-tabs-only mode
# (DEMO_ON_MAINNET=1: it only spends tabs a visitor funds from their own wallet, at most 10 calls per tab and 50k sats in all;
# the covenant lets those coins go only to the provider on settle and back to the owner). Faucet and attack panel stay chipnet-only.
services:
  - type: web
    name: agenttab-api-chipnet
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node packages/server/src/main.ts
    healthCheckPath: /.well-known/agenttab
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NETWORK
        value: chipnet
      - key: TRUST_PROXY
        value: "1"
      - key: KEY_SEED
        generateValue: true
  - type: web
    name: agenttab-api-mainnet
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node packages/server/src/main.ts
    healthCheckPath: /.well-known/agenttab
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NETWORK
        value: mainnet
      - key: ALLOW_MAINNET
        value: "1"
      - key: DEMO_ON_MAINNET
        value: "1"
      - key: DEMO_MAINNET_MAX_TOTAL_SATS
        value: "50000"
      - key: MAX_TAB_BUDGET_SATS
        value: "100000"
      - key: TRUST_PROXY
        value: "1"
      - key: KEY_SEED
        generateValue: true
  - type: web
    name: agenttab
    runtime: static
    buildCommand: npm ci && npm run build -w @agenttab/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_SERVER_URL_CHIPNET
        value: https://agenttab-api-chipnet.onrender.com
      - key: VITE_SERVER_URL_MAINNET
        value: https://agenttab-api-mainnet.onrender.com
      - key: VITE_DECK_URL
        value: https://docs.google.com/presentation/d/1HWXYkITgDgsd3Xc6NcHcST592q_E5ljSumN9d2bI-l4/edit?usp=sharing
      - key: VITE_REPO_URL
        value: https://github.com/Aakash074/agenttab
      - key: VITE_PROTOTYPE_URL
        value: https://github.com/Aakash074/agenttab-prototype
      - key: VITE_DONATION_ZADDR
        value: bitcoincash:zqcgm29z05erjdk440n6pj2vwmc8x5gxzcnwfnnrul
  - type: web
    name: agenttab-bch
    runtime: static
    buildCommand: npm ci && npm run build -w @agenttab/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_SERVER_URL_CHIPNET
        value: https://agenttab-api-chipnet.onrender.com
      - key: VITE_SERVER_URL_MAINNET
        value: https://agenttab-api-mainnet.onrender.com
      - key: VITE_DECK_URL
        value: https://docs.google.com/presentation/d/1HWXYkITgDgsd3Xc6NcHcST592q_E5ljSumN9d2bI-l4/edit?usp=sharing
      - key: VITE_REPO_URL
        value: https://github.com/Aakash074/agenttab
      - key: VITE_PROTOTYPE_URL
        value: https://github.com/Aakash074/agenttab-prototype
      - key: VITE_DONATION_ZADDR
        value: bitcoincash:zqcgm29z05erjdk440n6pj2vwmc8x5gxzcnwfnnrul
